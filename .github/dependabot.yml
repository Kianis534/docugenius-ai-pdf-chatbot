version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      python-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Python version upgrades are deliberate: the ML stack (PyTorch, ChromaDB)
      # needs wheels for a new interpreter before the base image can move.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
