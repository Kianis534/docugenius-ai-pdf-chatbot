name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Upload a PDF ...
        2. Click "Summarize" ...
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or error message
      description: Server logs or the error shown in the UI. Remove any API keys before pasting.
      render: text
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Docker / local Python 3.12 on Windows 11, browser: Chrome 131"
